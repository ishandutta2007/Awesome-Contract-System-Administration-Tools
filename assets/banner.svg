<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="orbGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur stdDeviation="60"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)"/></pattern><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,30px) scale(1.15)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-50px,-40px) scale(.9)}}@keyframes pulseBeam{0%{stroke-dashoffset:0;opacity:.3}50%{stroke-dashoffset:100;opacity:.8}}@keyframes cardFloat{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes cardFloatReverse{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.badge-text,.sub-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.badge-text{font-weight:600;font-size:13px}.animated-orb-1{animation:floa