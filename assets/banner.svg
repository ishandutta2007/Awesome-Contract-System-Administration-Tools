<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }

      /* Dynamic Animations */
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1.1); }
        50% { transform: translate(-50px, -40px) scale(0.9); }
      }
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
        50% { stroke-dashoffset: 100; opacity: 0.8; }
      }
      @keyframes cardFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes cardFloatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .animated-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite;
      }
      .animated-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite;
      }
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: pulseBeam 8s linear infinite;
      }
      .float-card-1 {
        animation: cardFloat 6s ease-in-out infinite;
      }
      .float-card-2 {
        animation: cardFloatReverse 7s ease-in-out infinite;
      }
      .spin-ring {
        transform-origin: 1020px 210px;
        animation: rotateRing 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Background Orbs -->
  <circle cx="180" cy="100" r="140" fill="#38bdf8" opacity="0.18" filter="url(#orbGlow)" class="animated-orb-1" />
  <circle cx="1040" cy="280" r="160" fill="#818cf8" opacity="0.18" filter="url(#orbGlow)" class="animated-orb-2" />
  <circle cx="650" cy="350" r="130" fill="#c084fc" opacity="0.12" filter="url(#orbGlow)" class="animated-orb-1" />

  <!-- Dynamic System Admin Architectural Nodes (Right side visual accent) -->
  <g class="spin-ring" opacity="0.4">
    <circle cx="1020" cy="210" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="6 14" />
    <circle cx="1020" cy="210" r="150" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3 9" />
  </g>

  <!-- Network Connecting Lines -->
  <path d="M 860 140 L 980 180 L 1080 130" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-line" />
  <path d="M 980 180 L 1020 280 L 890 310" fill="none" stroke="#818cf8" stroke-width="1.5" class="pulse-line" />

  <!-- Floating Architectural Cards / Administrative Badges (Right Canvas) -->
  <g class="float-card-1">
    <!-- Card 1: Role Permissions -->
    <rect x="880" y="80" width="220" height="64" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="910" cy="112" r="14" fill="rgba(56, 189, 248, 0.2)" />
    <text x="910" y="117" text-anchor="middle" font-size="14" fill="#38bdf8">🔒</text>
    <text x="936" y="106" class="badge-text" fill="#f8fafc">RBAC &amp; Tenant Roles</text>
    <text x="936" y="125" class="sub-text" font-size="11" fill="#94a3b8">Least-Privilege Security</text>
  </g>

  <g class="float-card-2">
    <!-- Card 2: Workflow Automation -->
    <rect x="940" y="240" width="220" height="64" rx="10" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <circle cx="970" cy="272" r="14" fill="rgba(192, 132, 252, 0.2)" />
    <text x="970" y="277" text-anchor="middle" font-size="14" fill="#c084fc">⚡</text>
    <text x="996" y="266" class="badge-text" fill="#f8fafc">Approval Workflows</text>
    <text x="996" y="285" class="sub-text" font-size="11" fill="#94a3b8">Lifecycle Automation</text>
  </g>

  <g class="float-card-1">
    <!-- Card 3: Audit & Governance -->
    <rect x="830" y="180" width="190" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1" />
    <circle cx="855" cy="206" r="12" fill="rgba(129, 140, 248, 0.2)" />
    <text x="855" y="211" text-anchor="middle" font-size="12" fill="#818cf8">📋</text>
    <text x="876" y="202" class="badge-text" fill="#f8fafc" font-size="12">Audit Trails</text>
    <text x="876" y="218" class="sub-text" font-size="10" fill="#94a3b8">Full Administrative Logs</text>
  </g>

  <!-- Foreground Content: Unobstructed Title, Tagline & Description -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 72)">
      <rect width="280" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="20" class="badge-text" fill="#38bdf8" font-size="12" letter-spacing="0.5">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title-text" font-size="44" fill="#ffffff">
      Awesome Contract System
    </text>
    <text x="0" y="215" class="title-text" font-size="44" fill="url(#accentGrad)" filter="url(#glow)">
      Administration Tools
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="265" class="sub-text" font-size="17" fill="#cbd5e1" font-weight="500">
      Enterprise CLM Configuration • Tenant Provisioning • Granular RBAC Permissions
    </text>
    <text x="0" y="295" class="sub-text" font-size="14" fill="#94a3b8">
      A curated guide covering market-leading SaaS suites and production-ready open-source platforms.
    </text>

    <!-- Feature Pills in Bottom Foreground -->
    <g transform="translate(0, 332)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="65" y="20" text-anchor="middle" class="badge-text" fill="#e2e8f0">🏢 SaaS Suites</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="168" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="226" y="20" text-anchor="middle" class="badge-text" fill="#e2e8f0">💻 Open-Source CLM</text>

      <!-- Pill 3 -->
      <rect x="322" y="0" width="148" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="396" y="20" text-anchor="middle" class="badge-text" fill="#e2e8f0">🔐 Access &amp; RBAC</text>

      <!-- Pill 4 -->
      <rect x="482" y="0" width="156" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="560" y="20" text-anchor="middle" class="badge-text" fill="#e2e8f0">⚡ Workflow Engine</text>
    </g>
  </g>
</svg>
